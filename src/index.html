<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Poppins&display=swap"
      rel="stylesheet"
    />
    <title>Juan Fernando Agudelo · Portafolio 3D interactivo bajo el agua</title>
    <meta
      name="description"
      content="Explora en un submarino los proyectos de Juan Fernando Agudelo, ingeniero de software, de IA y de datos en Medellín. Muévete con el mouse, rompe el piso y descubre cada uno."
    />
    <meta property="og:title" content="Juan Fernando Agudelo · Portafolio 3D interactivo bajo el agua" />
    <meta
      property="og:image"
      content="https://proyectos-personales-nu.vercel.app/images/social.png?v=4"
    />
    <meta
      property="og:description"
      content="Explora en un submarino los proyectos de Juan Fernando Agudelo, ingeniero de software, de IA y de datos en Medellín. Muévete con el mouse, rompe el piso y descubre cada uno."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://proyectos-personales-nu.vercel.app/" />
    <meta property="og:image:alt" content="Juan Fernando Agudelo, portafolio 3D interactivo: un submarino con linterna explora una estructura hundida" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body style="--progress: 0">
    <button id="audio" style="opacity: 0">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </button>
    <dialog id="dialog">
      <div class="content">
        <p class="description">Juan Fernando Agudelo - portafolio personal</p>
        <p class="credit">
          Experiencia muy inspirada en el juego
          <a href="https://playdead.com/games/inside/" target="_blank"
          >INSIDE</a
          >
          de <a href="https://playdead.com" target="_blank">Playdead</a>
          <br />
          Construida sobre el portafolio de código abierto de
          <a href="https://pawel-brod.com" target="_blank">Paweł Bród</a>
        </p>
        <div class="loader_bar"></div>
        <h1 class="title">ecos desde el fondo</h1>
        <button id="button">Explorar</button>
        
      </div>
    </dialog>
    <div id="mouse-helper" style="opacity: 0">
      <p class="left-click">MOVE</p>
      <p class="right-click">POWER</p>
      <img src="/images/mouse.png" alt="" draggable="false" />
    </div>
    <a
      id="github-link"
      href="https://github.com/Juan-Fer-Agudelo/Proyectos-Personales"
      aria-label="View source on GitHub"
      style="opacity: 0"
      target="_blank"
    >
      <img
        src="/images/github-mark.svg"
        alt="View source on GitHub"
        draggable="false"
      />
    </a>
    <canvas id="canvas"></canvas>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
